version: '3.8'

services:
  flght_auth_db:
    image: postgres:15
    container_name: flight_auth_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5434:5432"
    networks:
      - shared_flight_net # <--- ПРИВЯЗАЛИ К СЕТИ

  flight-auth-app:
    build: .
    volumes:
      - .:/app
    container_name: flight_auth_service
    ports:
      - "8001:80"
    depends_on:
      - flght_auth_db
    env_file:
      - .env
    networks:
      - shared_flight_net # <--- ПРИВЯЗАЛИ К СЕТИ

# <--- ОПИСАЛИ СЕТЬ В КОНЦЕ ФАЙЛА --->
networks:
  shared_flight_net:
    external: true
    name: flight_network